name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `rustup show` installs the toolchain pinned in rust-toolchain.toml
      # (including its rustfmt/clippy components), keeping CI on the same
      # compiler as local builds and the release pipeline.
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build

  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      # audit-check installs cargo-audit without `--locked` when it is missing,
      # which pulls dependencies newer than the pinned toolchain supports.
      # Pre-installing a prebuilt binary makes it skip that step without
      # compiling cargo-audit from source on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-audit
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
